[build]
  base = "client"
  command = "npm ci && npm run build"
  publish = "dist"

# Keep API calls same-origin so the HttpOnly session cookie works across the
# Netlify frontend and Render backend.
[[redirects]]
  from = "/api/*"
  to = "https://jovac-project-ai-interview02-3.onrender.com/api/:splat"
  status = 200
  force = true

# React Router client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
